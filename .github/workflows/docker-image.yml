name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 全局环境变量，解决 Node 20 过期警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # 确保这里引用的名字和你在 Settings 页面填写的 Secret 名字一模一样
          username: ${{ secrets.momoxyw }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 请把 'yourusername' 改成你的 Docker Hub 用户名
          # 把 'your-repo-name' 改成你想给镜像起的名字
          tags: ${{ secrets.momoxyw }}/v2x:latest
