user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 全局 WebSocket 优化
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen               80 default_server;
        listen               [::]:80 default_server;
        server_name          _;

        # 【智能分流逻辑】
        location / {
            # 1. 如果检测到是客户端 WebSocket 握手
            if ($http_upgrade = "websocket") {
                proxy_pass http://127.0.0.1:8880;
            }

            # --- 核心：解决“连上没网”的关键配置 ---
            proxy_buffering off;             # 关闭响应缓存，数据即时到达
            proxy_request_buffering off;     # 关闭请求缓存
            tcp_nodelay on;                  # 禁用 Nagle 算法，减少延迟
            proxy_read_timeout 3600s;        # 防止长连接被 Nginx 主动切断
            proxy_send_timeout 3600s;
            # ------------------------------------

            # 2. 如果是浏览器，显示网页
            root /usr/share/nginx/html;
            index index.html;

            # 基础转发头
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            
            # 真实 IP 传递 (支持双栈)
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # V2Ray 路径转发
        location VMESS_WSPATH {
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
        }

        location VLESS_WSPATH {
            proxy_pass http://127.0.0.1:20000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
        }
    }
}
