user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 定义 WebSocket 握手映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # --- 1. X-Tunnel 专属路径 (彻底解决 Connection Header 丢失问题) ---
        location /xt {
            proxy_pass http://127.0.0.1:8880/; 
            
            # 必须强制使用 HTTP/1.1 才能支持 WebSocket 升级
            proxy_http_version 1.1;
            
            # 【核心修复】：直接写死头信息，防止变量为空导致升级失败
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "upgrade";
            
            # 保持 Host 信息，这对 X-Tunnel 验证域名很重要
            proxy_set_header Host $http_host;

            # 彻底禁用缓存，确保数据包即时到达 (解决 TX/RX 横杠)
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            tcp_nodelay on;

            # 延长超时，防止长时间不操作被断开
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- 2. 根路径 (仅用于显示静态网页) ---
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # --- 3. V2Ray 路径 (保持兼容) ---
        location VMESS_WSPATH {
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
        }

        location VLESS_WSPATH {
            proxy_pass http://127.0.0.1:20000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
        }
    }
}
