user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 全局 WebSocket 映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen               80 default_server;
        listen               [::]:80 default_server;
        server_name          _;

        # 【智能分流与透明传输逻辑】
        location / {
            # 1. 协议探测：如果是 WS 握手，直接丢给 X-Tunnel
            if ($http_upgrade = "websocket") {
                proxy_pass http://127.0.0.1:8880;
            }

            # 2. 【核心修复】彻底解决有发送无接收 (TX/RX -) 问题
            proxy_buffering off;             # 必须关闭响应缓冲
            proxy_request_buffering off;     # 必须关闭请求缓冲
            proxy_cache off;                 # 彻底禁用缓存
            tcp_nodelay on;                  # 减少小包延迟
            
            # 3. 强制握手头 (部分客户端对 Connection 大小写敏感，这里用小写 upgrade)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 4. 保持长连接不中断
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # 5. 传递身份与路径信息
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 6. 普通浏览器访问时显示的网页
            root /usr/share/nginx/html;
            index index.html;
        }

        # V2Ray 路径转发 (保持现有逻辑)
        location VMESS_WSPATH {
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
        }

        location VLESS_WSPATH {
            proxy_pass http://127.0.0.1:20000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
        }
    }
}
