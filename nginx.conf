user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 定义 WebSocket 握手映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # --- 1. X-Tunnel 专属路径 (流式透明转发) ---
        location /xt {
            proxy_pass http://0.0.0.0:8880/; 
            
            proxy_http_version 1.1;
            
            # 基础握手头：直接透传变量
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 补全 WebSocket 安全头 (确保二次握手成功)
            proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
            proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
            proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
            
            # 基础信息透传
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 【核心修正】解决有发送无接收 (TX/RX -) 的关键：
            proxy_buffering off;             # 关闭响应缓冲
            proxy_request_buffering off;     # 关闭请求缓冲
            proxy_cache off;                 # 禁用缓存
            tcp_nodelay on;                  # 数据包立即发送
            chunked_transfer_encoding on;    # 开启分块传输

            # 延长超时，防止隧道静默断开
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- 2. 根路径 (静态网页) ---
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # --- 3. V2Ray 路径 (保持不变) ---
        location VMESS_WSPATH {
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
        }

        location VLESS_WSPATH {
            proxy_pass http://127.0.0.1:20000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
        }
    }
}
