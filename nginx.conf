user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 1. 核心分流逻辑：根据 Upgrade 头决定转发到哪里
    map $http_upgrade $backend_server {
        default       http://static_backend; # 普通网页
        "websocket"   http://127.0.0.1:8880; # X-Tunnel
    }

    upstream static_backend {
        server 127.0.0.1:81; # 假定一个端口给静态网页
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # 核心转发入口
        location / {
            # 转发给 map 定义的后端
            proxy_pass $backend_server;
            
            # 必须有的 WebSocket 头
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;

            # 关闭所有缓存（解决 RX - 的关键）
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            tcp_nodelay on;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # V2Ray 路径保持不变
        location VMESS_WSPATH {
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
        }

        location VLESS_WSPATH {
            proxy_pass http://127.0.0.1:20000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
        }
    }

    # 另开一个 Server 块处理静态网页，避开逻辑冲突
    server {
        listen 127.0.0.1:81;
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
