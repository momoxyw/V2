user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # 定义标准 WebSocket 握手映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # --- 1. X-Tunnel 专属路径 (流式透明转发) ---
        # 优化重点：禁用一切缓冲，允许 Subprotocol 穿透
        location /xt {
            proxy_pass http://127.0.0.1:8880/; 
            proxy_http_version 1.1;
            
            # 精确头转发
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            
            # 禁用缓冲区：这是解决 TX-RX 0 的核心
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            
            # 穿透所有 WebSocket 专用头
            proxy_pass_header Sec-Websocket-Extensions;
            proxy_pass_header Sec-Websocket-Protocol;
            
            # 延长超时时间，防止长连接被 Nginx 主动切断
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
            # 开启实时转发
            tcp_nodelay on;
        }

        # --- 2. VMess 路径 ---
        location VMESS_WSPATH {
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            
            # VMess 通常需要稍微开启缓存以保证稳定性
            proxy_buffering on;
        }

        # --- 3. VLESS 路径 ---
        location VLESS_WSPATH {
            proxy_pass http://127.0.0.1:20000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
        }

        # --- 4. 根路径 (伪装网站) ---
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
